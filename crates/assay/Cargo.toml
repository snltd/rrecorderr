[package]
name = "assay"
# version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
bigdecimal = "0.4.11"
camino = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15.7"
mysql = "28"
regex = "1"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "bigdecimal"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"

[dev-dependencies]
snltest = { git = "https://github.com/snltd/snltest.git" }
