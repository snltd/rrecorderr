[package]
name = "assay"
edition = "2024"

[dependencies]
camino = "1"
dotenvy = "0.15.7"
regex = "1"
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "bigdecimal"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"

[dev-dependencies]
snltest = { git = "https://github.com/snltd/snltest.git" }
